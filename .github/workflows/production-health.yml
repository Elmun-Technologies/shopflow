name: Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Frontend and security headers
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --dump-header - --output /tmp/shopflow.html https://shop-flow.uz/)"
          grep -qi '^strict-transport-security:' <<<"$headers"
          grep -qi '^content-security-policy:' <<<"$headers"
          grep -q '<div id="root"' /tmp/shopflow.html

      - name: Backend and database health
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors https://shop-flow.uz/api/health)"
          jq -e '.status == "ok" and .db == "ok"' <<<"$response"

      - name: Canonical www redirect
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --dump-header - --output /dev/null https://www.shop-flow.uz/)"
          grep -Eq '^HTTP/[0-9.]+ 30[18]' <<<"$headers"
          grep -qi '^location: https://shop-flow.uz/' <<<"$headers"

      - name: TLS certificate has at least 14 days left
        run: |
          set -euo pipefail
          echo | openssl s_client -connect shop-flow.uz:443 -servername shop-flow.uz 2>/dev/null \
            | openssl x509 -noout -checkend 1209600

