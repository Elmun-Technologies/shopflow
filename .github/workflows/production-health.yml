name: Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Repository variable PRODUCTION_DOMAIN yangi server/domain uchun almashtiriladi.
      DOMAIN: ${{ vars.PRODUCTION_DOMAIN || 'shop-flow.uz' }}
    steps:
      - name: Frontend and security headers
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --dump-header - --output /tmp/shopflow.html "https://${DOMAIN}/")"
          grep -qi '^strict-transport-security:' <<<"$headers"
          grep -qi '^content-security-policy:' <<<"$headers"
          grep -q '<div id="root"' /tmp/shopflow.html

      - name: Backend and database health
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors "https://${DOMAIN}/api/health")"
          jq -e '.status == "ok" and .db == "ok"' <<<"$response"

      - name: Canonical www redirect
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --dump-header - --output /dev/null "https://www.${DOMAIN}/")"
          grep -Eq '^HTTP/[0-9.]+ 30[18]' <<<"$headers"
          grep -qi "^location: https://${DOMAIN}/" <<<"$headers"

      - name: TLS certificate has at least 14 days left
        run: |
          set -euo pipefail
          echo | openssl s_client -connect "${DOMAIN}:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -noout -checkend 1209600

