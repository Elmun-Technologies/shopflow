server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets aggressively, but never the entrypoint HTML —
    # so a deploy is reflected on first reload.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback: serve index.html for any non-asset route.
    location / {
        try_files $uri /index.html;
    }

    # Gzip-on for text/JS/CSS — meaningful win for first paint.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
