server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org https://accounts.google.com https://www.googletagmanager.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://telegram.org https://accounts.google.com https://www.google-analytics.com https://mc.yandex.ru; frame-src https://accounts.google.com https://web.telegram.org; frame-ancestors 'self' https://web.telegram.org; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Don't expose nginx version
    server_tokens off;

    # Body size limit
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Uploaded images — served directly from volume.
    # ^~ ensures this prefix wins over the image-extension regex location below,
    # otherwise requests like /uploads/xyz.jpg get matched by the regex and
    # served from /usr/share/nginx/html instead of /app/uploads.
    location ^~ /uploads/ {
        alias /app/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Health check endpoint for Docker/Caddy/load balancers
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # PWA Service Worker — hech qachon cache (har deploy yangilanishi kerak)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # PWA Manifest — qisqa cache, to'g'ri MIME
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Hashed assets — immutable cache (1 year)
    location ~* /assets/.*\.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets — 30 days
    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA fallback — never cache index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
