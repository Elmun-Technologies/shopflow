# ShopFlow production deploy
# Stack: Postgres + Backend (Fastify) + Frontend (nginx) + Caddy (HTTPS reverse-proxy)
#
# Foydalanish:
#   1. .env faylida DOMAIN, EMAIL, JWT_SECRET, POSTGRES_PASSWORD ni o'rnating
#   2. Domain A-record VPS IP manziliga ko'rsatishi kerak
#   3. `docker compose up -d --build`
#   4. Birinchi marta: `docker compose exec backend npm run seed`

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopflow}
      POSTGRES_USER: ${POSTGRES_USER:-shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da o'rnating}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopflow}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shopflow-net
    mem_limit: 1g
    mem_reservation: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shopflow-backend:latest
    container_name: shopflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env da o'rnating (kamida 32 belgi)}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://shop-flow.uz}
      DOMAIN: ${DOMAIN:-shop-flow.uz}
      PUBLIC_URL: ${PUBLIC_URL:-https://shop-flow.uz}
      PORT: "4000"
      UPLOADS_DIR: /app/uploads
      # AI yordamchi — ixtiyoriy. Sozlansa Telegram'da mijoz xabarlariga AI javob beradi
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net
    # OOM himoyasi — bir tenant cheksiz ko'p so'rov bo'lsa ham host
    # to'liq egallanmaydi. VPS RAM'ga qarab moslash mumkin.
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5

  shopflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopflow:latest
    container_name: shopflow-app
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - shopflow-net

  caddy:
    image: caddy:2-alpine
    container_name: shopflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-shop-flow.uz}
      EMAIL: ${EMAIL:-admin@shop-flow.uz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      shopflow:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - shopflow-net

  # Avtomatik kunlik DB backup. Postgres image'da pg_dump bor — engil shell loop
  # cron o'rniga (cron docker'da murakkab). 24 soat kutadi, keyin dump, gzip,
  # eski (>7 kun) backuplarni o'chiradi.
  backup:
    image: postgres:16-alpine
    container_name: shopflow-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopflow}
      RETENTION_DAYS: "7"
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net
    mem_limit: 256m
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[backup] kunlik backup loop boshlandi"
        while true; do
          DATE=$$(date +%Y%m%d_%H%M%S)
          FILE="/backups/shopflow_$$DATE.sql.gz"
          echo "[backup] $$DATE: pg_dump boshlandi"
          if pg_dump "$$DATABASE_URL" | gzip > "$$FILE"; then
            echo "[backup] $$DATE: yakunlandi → $$FILE"
          else
            echo "[backup] $$DATE: XATO" >&2
            rm -f "$$FILE"
          fi
          # Eski backuplarni o'chirish
          find /backups -type f -name 'shopflow_*.sql.gz' -mtime +$$RETENTION_DAYS -delete 2>/dev/null || true
          sleep 86400
        done

networks:
  shopflow-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
  backup_data:
