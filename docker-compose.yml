# ShopFlow production deploy
# Stack: Postgres + Backend (Fastify) + Frontend (nginx) + Caddy (HTTPS reverse-proxy)
#
# Foydalanish:
#   1. .env faylida DOMAIN, EMAIL, JWT_SECRET, POSTGRES_PASSWORD ni o'rnating
#   2. Domain A-record VPS IP manziliga ko'rsatishi kerak
#   3. `docker compose up -d --build`
#   4. Birinchi marta: `docker compose exec backend npm run seed`

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopflow}
      POSTGRES_USER: ${POSTGRES_USER:-shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da o'rnating}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopflow}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shopflow-net
    mem_limit: 1g
    mem_reservation: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shopflow-backend:latest
    container_name: shopflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env da o'rnating (kamida 32 belgi)}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://shop-flow.uz}
      DOMAIN: ${DOMAIN:-shop-flow.uz}
      PUBLIC_URL: ${PUBLIC_URL:-https://shop-flow.uz}
      PORT: "4000"
      UPLOADS_DIR: /app/uploads
      # AI yordamchi — ixtiyoriy. Sozlansa Telegram'da mijoz xabarlariga AI javob beradi
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Web Push (ixtiyoriy — kalit yo'q bo'lsa push silent skip)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@shop-flow.uz}
      # Google OAuth (ixtiyoriy — sozlansa admin panelda "Google bilan kirish" yoqiladi).
      # Frontend uchun build vaqtida VITE_GOOGLE_CLIENT_ID ham xuddi shu qiymat bilan kerak.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Sentry (ixtiyoriy)
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Sezgir 3rd-party tokenlar shifrlash kaliti (alohida, JWT'dan farqli)
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # Email (ixtiyoriy — avtomatik hisobotlar uchun)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Eskiz SMS (ixtiyoriy)
      ESKIZ_LOGIN: ${ESKIZ_LOGIN:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net
    # OOM himoyasi — bir tenant cheksiz ko'p so'rov bo'lsa ham host
    # to'liq egallanmaydi. VPS RAM/CPU'ga qarab moslash mumkin.
    mem_limit: 1g
    mem_reservation: 256m

  shopflow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Google OAuth — .env'dagi VITE_GOOGLE_CLIENT_ID build vaqtida frontend'ga embed qilinadi
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: shopflow:latest
    container_name: shopflow-app
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - shopflow-net

  caddy:
    image: caddy:2-alpine
    container_name: shopflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-shop-flow.uz}
      EMAIL: ${EMAIL:-admin@shop-flow.uz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      shopflow:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - shopflow-net

  # Avtomatik kunlik DB backup. Postgres image'da pg_dump bor — engil shell loop
  # cron o'rniga (cron docker'da murakkab). 24 soat kutadi, keyin dump, gzip,
  # eski (>7 kun) backuplarni o'chiradi.
  backup:
    image: postgres:16-alpine
    container_name: shopflow-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopflow}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      # Offsite backup (ixtiyoriy) — .env'da to'ldiring (S3 / Cloudflare R2 / Backblaze B2 / MinIO)
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - backup_data:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopflow-net
    mem_limit: 256m
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[backup] kunlik backup loop boshlandi"
        if [ -n "$$BACKUP_S3_BUCKET" ]; then
          echo "[backup] offsite yoqilgan ($$BACKUP_S3_BUCKET) — aws-cli o'rnatilmoqda"
          apk add --no-cache aws-cli >/dev/null 2>&1 || echo "[backup] aws-cli o'rnatib bo'lmadi — faqat local backup"
        fi
        while true; do
          sh /scripts/backup.sh || echo "[backup] backup sikli xatosi"
          sleep 86400
        done

networks:
  shopflow-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
  backup_data:
