<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopFlow — zamonaviy e-commerce admin dashboard. Buyurtmalar, mijozlar, mahsulotlar va marketing kampaniyalari boshqaruvi." />
    <meta name="theme-color" content="#5FA340" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShopFlow" />
    <meta property="og:title" content="ShopFlow — E-commerce Admin Dashboard" />
    <meta property="og:description" content="Zamonaviy, keng funksiyali e-commerce boshqaruv paneli" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z'/%3E%3Cline x1='3' y1='6' x2='21' y2='6'/%3E%3Cpath d='M16 10a4 4 0 0 1-8 0'/%3E%3C/svg%3E" />
    <title>ShopFlow — E-commerce Dashboard</title>
    <!--
      Telegram Mini App SDK — O'Z DOMENIMIZDAN beriladi.
      Ilgari to'g'ridan-to'g'ri https://telegram.org/js/telegram-web-app.js edi. Bu
      Mini App'ni uchinchi domenga bog'lab qo'yardi: mobil operator telegram.org ni
      bloklasa yoki sekin bersa, `window.Telegram` umuman paydo bo'lmaydi va
      `ready()`/`expand()` chaqirilmagani uchun Telegram yuklanish ekranida qotib
      qoladi ("do'kon ochilmayapti"), bot esa MTProto orqali normal ishlayveradi —
      shuning uchun muammo faqat ayrim tarmoqlarda/qurilmalarda ko'rinadi.
      Docker build vaqtida `public/vendor/telegram-web-app.js` haqiqiy nusxa bilan
      almashtiriladi; repodagi fayl — CDN'ga qaytadigan zaxira stub.
    -->
    <script src="/vendor/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Boot watchdog — bundle yuklanmasa/ishga tushmasa oq ekran o'rniga
      o'qiladigan xabar. Tailwind yoki React'ga bog'liq emas (ular yuklanmagan
      bo'lishi mumkin), shuning uchun inline CSS va oddiy JS.
    -->
    <div id="boot-fallback" hidden>
      <div class="bf-card">
        <div class="bf-icon">⚠️</div>
        <h1>Ilova yuklanmadi</h1>
        <p id="boot-reason"></p>
        <button type="button" id="boot-retry">Qayta urinish</button>
        <pre id="boot-diag"></pre>
      </div>
    </div>
    <style>
      #boot-fallback[hidden] { display: none; }
      #boot-fallback {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        padding: 20px; background: #17212b; color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #boot-fallback .bf-card {
        max-width: 380px; width: 100%; text-align: center;
        background: #202b36; border: 1px solid #2b3844; border-radius: 16px; padding: 24px;
      }
      #boot-fallback .bf-icon { font-size: 32px; line-height: 1; margin-bottom: 12px; }
      #boot-fallback h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
      #boot-fallback p { font-size: 14px; line-height: 1.5; color: #aab8c2; margin: 0 0 18px; }
      #boot-fallback button {
        appearance: none; border: 0; cursor: pointer;
        background: #5FA340; color: #fff; font-size: 15px; font-weight: 600;
        border-radius: 10px; padding: 11px 22px; width: 100%;
      }
      #boot-fallback pre {
        margin: 16px 0 0; padding: 10px; text-align: left;
        font-size: 10px; line-height: 1.5; color: #7d8b98;
        background: #17212b; border-radius: 8px;
        white-space: pre-wrap; word-break: break-all;
      }
    </style>
    <script>
      (function () {
        var TIMEOUT_MS = 12000;
        var failedResources = [];
        var shown = false;

        function diagnostics() {
          var tg = window.Telegram && window.Telegram.WebApp;
          return [
            "sdk: " + (tg ? "ok v" + (tg.version || "?") + " / " + (tg.platform || "?") : "YO'Q"),
            "url: " + location.pathname,
            "online: " + (navigator.onLine ? "ha" : "yo'q"),
            "sw: " + ("serviceWorker" in navigator ? (navigator.serviceWorker.controller ? "faol" : "yo'q") : "qo'llab-quvvatlanmaydi"),
            failedResources.length ? "yuklanmadi: " + failedResources.join(", ") : "",
            "ua: " + navigator.userAgent,
          ].filter(Boolean).join("\n");
        }

        function show(reason) {
          if (shown) return;
          var root = document.getElementById("root");
          if (root && root.children.length > 0) return; // ilova baribir chizildi
          var el = document.getElementById("boot-fallback");
          if (!el) return;
          shown = true;
          document.getElementById("boot-reason").textContent = reason;
          document.getElementById("boot-diag").textContent = diagnostics();
          el.hidden = false;
        }

        // main.tsx render'da yiqilsa shu orqali xabar beradi
        window.__shopflowBootFailed = show;

        // Yuklanmagan <script>/<link> larni yig'amiz — sababni aniq aytish uchun
        window.addEventListener(
          "error",
          function (e) {
            var el = e && e.target;
            if (!el || !el.tagName) return;
            var src = el.src || el.href;
            if (!src) return;
            try { src = new URL(src, location.href).pathname; } catch (_) { /* xom qoldiramiz */ }
            failedResources.push(src);
            show("Kerakli fayl yuklanmadi. Internet aloqangizni tekshiring yoki keyinroq urinib ko'ring.");
          },
          true
        );

        document.getElementById("boot-retry").addEventListener("click", function () {
          location.reload();
        });

        setTimeout(function () {
          show("Ilova 12 soniyada yuklanmadi. Internet sekin yoki fayllarga ruxsat yo'q bo'lishi mumkin.");
        }, TIMEOUT_MS);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
