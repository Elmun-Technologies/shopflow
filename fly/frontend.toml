# Deploy from repository root with:
#   fly deploy --config fly/frontend.toml
# Change `app` and `BACKEND_APP` before the first deploy if needed.

app = "shopflow-frontend"
primary_region = "fra"

[build]
  # root deploy context is the repository root; this path is relative to fly/frontend.toml.
  dockerfile = "frontend.Dockerfile"
  [build.args]
    BACKEND_APP = "shopflow-backend"
    VITE_GOOGLE_CLIENT_ID = ""
    VITE_SENTRY_DSN = ""

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
